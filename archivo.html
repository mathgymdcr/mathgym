<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MathGym — Archivo de retos</title>

  <meta name="description" content="Todos los retos de lógica publicados en MathGym, día a día. Vuelve a cualquiera cuando quieras.">
  <link rel="canonical" href="https://mathgym.es/archivo.html">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MathGym">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="MathGym — Archivo de retos">
  <meta property="og:description" content="Todos los retos de lógica publicados en MathGym, día a día.">
  <meta property="og:url" content="https://mathgym.es/archivo.html">
  <meta property="og:image" content="https://mathgym.es/assets/og-mathgym.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MathGym — Archivo de retos">
  <meta name="twitter:description" content="Todos los retos de lógica publicados en MathGym, día a día.">
  <meta name="twitter:image" content="https://mathgym.es/assets/og-mathgym.jpg">

  <link rel="icon" href="assets/logo_mathgym.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Lexend:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 60px;
      text-align: center;
    }

    .title-zone {
      margin-bottom: 40px;
    }

    .title-zone h2 {
      color: var(--accent);
      font-size: 2.3rem;
      margin-bottom: 8px;
    }

    .title-zone p {
      color: var(--muted);
      font-size: 1.1rem;
    }

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1100px;
      width: 100%;
    }

    .reto-card {
      display: block;
      text-align: left;
      text-decoration: none;
    }

    .reto-card h3 {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .reto-card small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
    }

    .category-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 1100px;
      margin-bottom: 24px;
    }

    .category-chip {
      font: inherit;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--card-b);
      background: rgba(255,255,255,.04);
      color: var(--muted);
      font-size: 0.85rem;
      text-transform: capitalize;
      transition: all 0.15s ease;
    }

    .category-chip:hover {
      border-color: var(--accent);
      color: var(--fg);
    }

    .category-chip.is-active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .difficulty-dots {
      display: block;
      margin-top: 2px;
      letter-spacing: 2px;
      color: var(--accent);
      font-size: 0.8rem;
    }
  </style>
</head>

<body>
  <!-- CABECERA -->
  <header class="enigma-header-dark site-header">
    <img src="assets/logo_mathgym.png" alt="Logo MathGym">
    <div>
      <h2>MathGym</h2>
      <p class="site-header-tagline">Tu gimnasio mental diario 🧩</p>
    </div>
  </header>
  <nav class="site-nav">
    <a href="index.html" class="btn btn-secondary">🏠 Inicio</a>
  </nav>

  <!-- CONTENIDO -->
  <main>
    <div class="title-zone">
      <h2>Archivo de Retos</h2>
      <p>Explora los retos anteriores y sigue fortaleciendo tu mente</p>
    </div>

    <div class="category-chips" id="filtro-categorias">
      <!-- Rellenado dinámicamente por archivo.js -->
    </div>

    <div class="archive-grid" id="lista-retos">
      <!-- Rellenado dinámicamente por archivo.js -->
    </div>
  </main>

  <footer class="site-footer">
    © <span id="year"></span> MathGym — Proyecto educativo libre
  </footer>

  <script src="archivo.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
